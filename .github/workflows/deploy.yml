name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod-dryrun
          - prod

jobs:
  deploy-dev:
    name: Deploy to LocalStack (dev)
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ec2,ecs,rds,elbv2,wafv2,iam,logs,sts
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Install tflocal
        run: pip install -r requirements-ci.txt

      - name: tflocal init
        working-directory: terraform/environments/dev
        run: tflocal init

      - name: tflocal plan
        working-directory: terraform/environments/dev
        run: tflocal plan -out=tfplan
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}

      - name: tflocal apply
        working-directory: terraform/environments/dev
        run: tflocal apply -auto-approve tfplan

      - name: Show ALB endpoint
        working-directory: terraform/environments/dev
        run: terraform output alb_dns_name

  deploy-prod-dryrun:
    name: Dry-run prod config on LocalStack (no real AWS needed)
    if: inputs.environment == 'prod-dryrun'
    runs-on: ubuntu-latest
    environment: dev
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ec2,ecs,rds,elbv2,wafv2,iam,logs,sts
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Install tflocal
        run: pip install -r requirements-ci.txt

      # Real prod uses `use_localstack = false` and pulls credentials
      - name: tflocal init
        working-directory: terraform/environments/prod
        run: tflocal init

      - name: tflocal plan
        working-directory: terraform/environments/prod
        run: tflocal plan -out=tfplan
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
          TF_VAR_use_localstack: "true"
          TF_VAR_aws_access_key: "test"
          TF_VAR_aws_secret_key: "test"

      - name: tflocal apply
        working-directory: terraform/environments/prod
        run: tflocal apply -auto-approve tfplan

      - name: Show ALB endpoint
        working-directory: terraform/environments/prod
        run: terraform output alb_dns_name

  deploy-prod:
    name: Terraform apply (real AWS prod)
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Real AWS credentials come from GitHub Environment secrets,
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: terraform init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: terraform plan
        working-directory: terraform/environments/prod
        run: terraform plan -out=tfplan
        env:
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}

      - name: terraform apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve tfplan

      - name: Show ALB endpoint
        working-directory: terraform/environments/prod
        run: terraform output alb_dns_name
