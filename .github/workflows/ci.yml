name: CI

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

jobs:
  terraform-validate:
    name: Terraform validate & format check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-${{ matrix.environment }}-${{ hashFiles('terraform/environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ matrix.environment }}-

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init (no backend, validate only)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  integration-test-localstack:
    name: Deploy to LocalStack and smoke-test
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ec2,ecs,rds,elbv2,wafv2,iam,logs,sts
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-dev-${{ hashFiles('terraform/environments/dev/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-dev-

      - name: Install tflocal
        run: pip install -r requirements-ci.txt

      - name: Copy example tfvars
        working-directory: terraform/environments/dev
        run: cp terraform.tfvars.example terraform.tfvars

      - name: tflocal init
        working-directory: terraform/environments/dev
        run: tflocal init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: tflocal apply
        working-directory: terraform/environments/dev
        run: tflocal apply -auto-approve

      - name: tflocal destroy (cleanup)
        if: always()
        working-directory: terraform/environments/dev
        run: tflocal destroy -auto-approve

  vulnerability-scan:
    name: OWASP-aligned static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          quiet: true
          soft_fail: true
