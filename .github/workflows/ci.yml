name: CI

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

jobs:
  terraform-validate:
    name: Terraform validate & format check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-${{ matrix.environment }}-${{ hashFiles('terraform/environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ matrix.environment }}-

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init (no backend, validate only)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: ./sample-app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test-localstack:
    name: Deploy to LocalStack and smoke-test
    runs-on: ubuntu-latest
    needs: build-and-push
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          SERVICES: ec2,ecs,rds,elbv2,wafv2,iam,logs,sts
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-providers-dev-${{ hashFiles('terraform/environments/dev/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-dev-

      - name: Install tflocal
        run: pip install -r requirements-ci.txt

      - name: Copy example tfvars
        working-directory: terraform/environments/dev
        run: cp terraform.tfvars.example terraform.tfvars

      - name: Use freshly built image
        working-directory: terraform/environments/dev
        run: |
          IMAGE=$(echo '${{ needs.build-and-push.outputs.image_tags }}' | head -n1)
          echo "container_image = \"$IMAGE\"" >> terraform.tfvars

      - name: tflocal init
        working-directory: terraform/environments/dev
        run: tflocal init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

      - name: tflocal apply
        working-directory: terraform/environments/dev
        run: tflocal apply -auto-approve

      - name: tflocal destroy (cleanup)
        if: always()
        working-directory: terraform/environments/dev
        run: tflocal destroy -auto-approve

  vulnerability-scan:
    name: OWASP-aligned static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          quiet: true
          soft_fail: true
