services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sample-app:
    build:
      context: ./sample-app
    environment:
      PORT: "8080"
      OIDC_ISSUER_URL: "http://keycloak:8080/realms/secure-deploy-kit"
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
